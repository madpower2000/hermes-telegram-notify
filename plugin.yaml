name: telegram-notify
version: "1.1.1"
description: "Sends compact Hermes lifecycle notifications to Telegram."
author: "madpower2000"
license: MIT
homepage: https://github.com/madpower2000/hermes-telegram-notify
api_version: 1
kind: standalone
requires_hermes: ">=0.21.5"
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - pre_approval_request
  - post_approval_response
optional_env:
  - TELEGRAM_BOT_TOKEN
  - TELEGRAM_CHAT_ID
  - HERMES_TELEGRAM_CHAT_ID
  - TELEGRAM_HOME_CHANNEL
  - CODEX_TELEGRAM_CHAT_ID
  - CODEX_TELEGRAM_NOTIFY_ENABLED
  - CODEX_TELEGRAM_PERMISSION_ALERTS
tags:
  - notifications
  - telegram
  - lifecycle
